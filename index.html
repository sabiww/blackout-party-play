 .bu-gate .bu-btns,.bu-end .bu-btns{margin-top:14px}
 .bu-auto{margin-top:6px;font-size:14px}
 .bu-auto+.bu-btns{margin-top:8px}
 .bu-x{right:2px;top:2px}
}
/* Вырез есть (<html data-sa>, index.html readSafe): окна стоят в безопасной области, высоты ей не хватает — слегка ужимаем. Без выреза атрибута нет и всё как раньше.
   Телефон стоя: стекла карточек Buy bonus квадратные (было 4:5), иначе нижний ряд кнопок BUY уходит под прокрутку. Боком: вход в «Камеры» — списку и кнопке чуть теснее. */
@media (max-width:760px) and (min-height:521px){ :root[data-sa] .bu-buy .bu-glass{aspect-ratio:1/1} }
@media (max-height:520px){ :root[data-sa] .bu-gate .bu-list li{margin:3px 0} :root[data-sa] .bu-gate .bu-btns{margin-top:9px} :root[data-sa] .bu-gate .bu-auto+.bu-btns{margin-top:6px} }
@media (prefers-reduced-motion:reduce){.bu-key:active,.bu-panel .bu-lens:active{transform:none}.bu-x .bu-screw,.bu-x .bu-screw .cross{transition:none}.bu-x:active .bu-screw{transform:none}}

/* ===== Правка плашек 2026-10-12 («нейрослоп»): ворота бонуса и итог (.bu-gate, .bu-end). Buy bonus (.bu-buy) не трогаем — его делает другая ветка =====
   Что было: рама из картинки panel-frame.png сжималась в 16 px — бока скручивались «верёвкой», угловые винты были вшиты в картинку и торчали за рамку;
   текст с тенью и свечением, радиусы 6 / 9 / 12, лампочки-маркеры с ореолом. Что стало: рама — та же ржавая сталь и тот же винт, что у плашек М1 (ui.css, #hud .m1):
   винты 6 px целиком внутри рамы шириной 10 px, одна толщина кромки, радиусы 3–4 px, заголовок без тени, маркеры — квадратики. */
.bu-panel:is(.bu-gate,.bu-end){--bu-bw:10px;border:var(--bu-bw) solid transparent;border-image:none;
 background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.26)) padding-box,url(assets/uikit/steel-red.webp?bpv=e884f8e5) 0 0/640px padding-box,
  linear-gradient(rgba(18,5,3,.18),rgba(18,5,3,.18)) border-box,url(assets/uikit/hud-m1-rust.webp?bpv=7da0f75f) 0 0/160px auto border-box,#8a2017;
 box-shadow:0 0 0 1px #0a0302,0 22px 46px rgba(0,0,0,.7)}
.bu-panel:is(.bu-gate,.bu-end)::before{inset:0;box-shadow:inset 0 0 0 1px #0a0302,inset 0 0 0 2px rgba(150,113,48,.5),inset 0 0 70px rgba(0,0,0,.38)}
.bu-panel:is(.bu-gate,.bu-end)::after{content:"";position:absolute;inset:calc(var(--bu-bw)*-1);pointer-events:none;z-index:2;
 --sh:radial-gradient(circle at 36% 30%,#b9a884,#8f7f62 38%,#5a4c3a 62%,#2a1a0f 68%,transparent 72%);
 background:linear-gradient(45deg,transparent 40%,#120a06 40% 60%,transparent 60%) left 2px top 2px/6px 6px no-repeat,var(--sh) left 2px top 2px/6px 6px no-repeat,
  linear-gradient(0deg,transparent 40%,#120a06 40% 60%,transparent 60%) right 2px top 2px/6px 6px no-repeat,var(--sh) right 2px top 2px/6px 6px no-repeat,
  linear-gradient(60deg,transparent 40%,#120a06 40% 60%,transparent 60%) left 2px bottom 2px/6px 6px no-repeat,var(--sh) left 2px bottom 2px/6px 6px no-repeat,
  linear-gradient(15deg,transparent 40%,#120a06 40% 60%,transparent 60%) right 2px bottom 2px/6px 6px no-repeat,var(--sh) right 2px bottom 2px/6px 6px no-repeat}
/* слои: шлиц выше шляпки — порядок в списке background (первый — сверху), поэтому шлиц стоит перед своей шляпкой */
.bu-panel:is(.bu-gate,.bu-end) .bu-h{text-shadow:none;letter-spacing:.04em}
.bu-panel:is(.bu-gate,.bu-end) .bu-scr{border-radius:3px;text-shadow:none}
.bu-panel.bu-gate .bu-hero,.bu-panel.bu-end .bu-total{border-radius:3px;text-shadow:none;box-shadow:inset 0 0 0 1px #000,0 0 0 1px #000,0 0 0 2px var(--bu-trim-d)}
.bu-panel:is(.bu-gate,.bu-end) .bu-lens{border-radius:4px;letter-spacing:.04em;box-shadow:inset 0 0 0 2px #5d3a0b,0 0 0 2px #0a0706,0 0 0 3px var(--bu-trim-d),0 4px 0 #000}
.bu-panel:is(.bu-gate,.bu-end) .bu-lens:active{box-shadow:inset 0 0 0 2px #5d3a0b,0 0 0 2px #0a0706,0 0 0 3px var(--bu-trim-d),0 1px 0 #000}
.bu-panel:is(.bu-gate,.bu-end) .bu-list li{text-shadow:none;padding-left:20px}
.bu-panel:is(.bu-gate,.bu-end) .bu-list li::before{left:2px;top:.5em;width:6px;height:6px;border-radius:0;box-shadow:0 0 0 1px #0a0302;background:var(--bu-amber)}
.bu-panel:is(.bu-gate,.bu-end) .bu-tag{letter-spacing:.3em}
@media (max-width:760px){.bu-panel:is(.bu-gate,.bu-end){--bu-bw:10px}}
@media (max-height:520px){.bu-panel:is(.bu-gate,.bu-end){--bu-bw:10px}}

/* ===== Окно Buy bonus в чистом виде (2026-10-13, по эталону berserk-mode): без доски, рамы, бумаги, скотча, ламп и штампов =====
   Содержимое стоит прямо на затемнённой игре (затемнение — #fmenu в index.html): само окно .bb прозрачное и занимает весь экран, внутри прокручивается .bb-in.
   Сверху название и ставка ‹ ›; винт закрытия — в правом верхнем углу экрана и всегда на виду (он вне прокрутки); раздел SPIN MODE — тонкие строки режимов; BUY BONUS — карточки в ряд; внизу RTP и максимальный выигрыш.
   Плашки (ставка, строка режима, название карточки) — тёмно-красные #3a1612 → #1c0b09 с латунным кантом #c98a2c, как в DESIGN.md; цифры и акценты — янтарь #FFC861.
   Шрифты: Black Ops One — название, имена, кнопки; Russo One — суммы; Barlow SC — подписи и строки описания.
   Свои классы bb-, чтобы не пересекаться с bonus-ui.css (ворота и итог бонуса) и с окнами F. Разметка — buy-board.js. */
@font-face{font-family:"Russo One";src:url(fonts/RussoOne-Regular.ttf?bpv=c05ca5b6) format("truetype");font-display:swap}
.bb,.bb *{box-sizing:border-box}
.bb{--amber:#FFC861;--cream:#f3e8cc;--cream2:#e2cfa6;--dim:#c9a46a;--brass:#c98a2c;--p1:#3a1612;--p2:#1c0b09;--edge:#0a0302;
 --boo:"Black Ops One",Impact,sans-serif;--rus:"Russo One","Black Ops One",Impact,sans-serif;--ui:"Barlow SC","Barlow Semi Condensed",system-ui,sans-serif;
 --plate:linear-gradient(180deg,var(--p1),var(--p2));--plate-sh:inset 0 0 0 1.5px var(--brass),0 0 0 1px var(--edge),0 8px 18px rgba(0,0,0,.5);
 position:relative;width:100%;height:100%;margin:0;color:var(--cream);font-family:var(--ui);text-align:center}
.bb-in{position:absolute;inset:0;display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain;padding:22px 72px 26px;scrollbar-width:thin;scrollbar-color:rgba(201,138,44,.5) transparent}
.bb-col{margin:auto;width:min(1040px,100%);display:flex;flex-direction:column;align-items:center;gap:16px} /* margin:auto — по центру, пока всё влезает; не влезает — прокрутка с самого верха */
.bb :where(h2,h3,h4,p){margin:0;font-weight:400}
.bb :where(button){font:inherit;-webkit-tap-highlight-color:transparent}

/* ---- название и ставка ---- */
.bb-top{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
.bb-h{font:400 46px/1.05 var(--boo);letter-spacing:.06em;color:var(--amber);text-wrap:balance;text-shadow:0 3px 0 #1a0705,0 0 26px rgba(255,170,60,.28)}
.bb-bet{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:8px;background:var(--plate);box-shadow:var(--plate-sh)}
.bb-key{flex:none;display:grid;place-items:center;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:6px;background:none;color:var(--amber);cursor:pointer}
.bb-key svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bb-key:hover{background:rgba(255,200,97,.12)}
.bb-key:active{transform:translateY(1px)}
.bb-bv{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:118px;padding:2px 6px}
.bb-bv small{font:700 11px/1 var(--ui);letter-spacing:.26em;color:var(--dim)}
.bb-bv b{font:400 25px/1 var(--rus);color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- подпись раздела: слово между двумя латунными линиями ---- */
.bb-g{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.bb-lab{display:flex;align-items:center;gap:14px;width:min(520px,100%);font:700 14px/1 var(--ui);letter-spacing:.34em;color:#e9c98e;white-space:nowrap}
.bb-lab::before,.bb-lab::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass))}
.bb-lab::after{background:linear-gradient(90deg,var(--brass),transparent)}
.bb-lab span{padding-left:.34em} /* letter-spacing добавляет хвост справа: уравниваем */

/* ---- режим: одна тонкая строка ---- */
.bb-mode{display:grid;grid-template-columns:58px minmax(0,1fr) auto minmax(150px,auto);grid-template-areas:"ic mt mp go";align-items:center;gap:6px 16px;width:min(740px,100%);padding:10px 12px 10px 10px;text-align:left;
 border-radius:6px;background:linear-gradient(90deg,rgba(58,22,18,.92),rgba(28,11,9,.92));box-shadow:inset 0 0 0 1px rgba(201,138,44,.6),0 0 0 1px var(--edge),0 10px 20px rgba(0,0,0,.45);transition:box-shadow .2s}
.bb-mode.on{box-shadow:inset 0 0 0 2px var(--amber),0 0 0 1px var(--edge),0 0 22px rgba(255,190,80,.22),0 10px 20px rgba(0,0,0,.45)}
.bb-ic{grid-area:ic;display:block;width:58px;height:58px;border-radius:4px;object-fit:cover;object-position:50% 40%;box-shadow:0 0 0 1px var(--edge),0 0 0 2px rgba(201,138,44,.55)}
.bb-mt{grid-area:mt;min-width:0}
.bb-mn{font:400 20px/1.1 var(--boo);letter-spacing:.04em;color:var(--cream)}
.bb-chip{display:inline-block;margin-left:10px;padding:3px 7px 2px;border-radius:3px;vertical-align:3px;font:700 11px/1 var(--ui);letter-spacing:.18em;color:#2a1405;background:var(--amber)}
.bb-ml{margin-top:4px;font:600 15px/1.25 var(--ui);color:var(--cream2)}
.bb-mp{grid-area:mp;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.bb-mp b{font:400 24px/1 var(--rus);color:var(--amber);white-space:nowrap}
.bb-mp small{font:700 11px/1 var(--ui);letter-spacing:.22em;color:var(--dim)}
.bb-mode .bb-go{grid-area:go}
.bb-need{display:block;max-width:100%;font:700 12px/1.2 var(--ui);letter-spacing:.06em;color:#ffa184}
.bb-mp .bb-need{margin-top:2px;text-align:right}

/* ---- кнопки: ACTIVATE — тёмная плашка, включённый режим — янтарь; BUY — тёмно-красный металл ---- */
.bb-go{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:0;padding:6px 16px;border:0;border-radius:6px;cursor:pointer;
 font:400 17px/1.1 var(--boo);letter-spacing:.08em;text-align:center;text-wrap:balance;transition:filter .15s}
.bb-go:hover{filter:brightness(1.12)}
.bb-go:active{transform:translateY(2px)}
.bb-tg{color:var(--amber);background:var(--plate);box-shadow:inset 0 0 0 1.5px var(--brass),0 0 0 1px var(--edge),0 3px 0 var(--edge),0 6px 10px rgba(0,0,0,.4)}
.bb-mode.on .bb-tg{color:#2a1405;background:linear-gradient(180deg,#ffdc97 0%,var(--amber) 48%,#f1b552 100%);box-shadow:inset 0 0 0 1.5px #5d3a0b,0 0 0 1px var(--edge),0 3px 0 var(--edge)}
.bb-buy{width:100%;color:#fbefd0;text-shadow:0 1px 0 #2a0a06;background:linear-gradient(180deg,#b23a28 0%,#8E2F24 46%,#5e1a12 100%);
 box-shadow:inset 0 1px 0 rgba(255,210,170,.32),inset 0 0 0 1.5px var(--brass),0 0 0 1px #1a0705,0 3px 0 #1a0705,0 6px 12px rgba(0,0,0,.45)}
.act{cursor:pointer}.act[aria-disabled=true]{cursor:not-allowed}
.off .bb-go{filter:saturate(.45) brightness(.82)}
.off .bb-go:hover{filter:saturate(.45) brightness(.9)}
/* янтарное кольцо фокуса — как на пульте */
.bb .bb-go:focus-visible,.bb .bb-key:focus-visible,.bb .bb-back:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.bb .bu-x:focus-visible .bu-screw{outline:3px solid var(--amber);outline-offset:3px}

/* ---- карточки покупок: в один ряд ---- */
.bb-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,290px));justify-content:center;gap:24px 44px;width:100%}
.bb-card{display:flex;flex-direction:column;align-items:center;gap:11px;min-width:0;container-type:inline-size}
.bb-pl{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:min(220px,100%);max-width:100%;padding:9px 18px 8px;border-radius:6px;background:var(--plate);box-shadow:var(--plate-sh)}
.bb-card.t2 .bb-pl{box-shadow:inset 0 0 0 1.5px var(--brass),inset 0 0 0 3.5px var(--p2),inset 0 0 0 4.5px rgba(201,138,44,.7),0 0 0 1px var(--edge),0 8px 18px rgba(0,0,0,.5)} /* «Камеры» — старшая покупка: двойной кант */
.bb-cn{font:400 22px/1.05 var(--boo);letter-spacing:.05em;color:var(--amber);text-wrap:balance}
.bb-cs{font:700 12px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--cream2)}
.bb-art{display:block;width:150px;aspect-ratio:6/5;border-radius:4px;object-fit:cover;object-position:50% 40%;box-shadow:0 0 0 1px var(--edge),0 0 0 2px rgba(201,138,44,.55),0 12px 22px rgba(0,0,0,.5)}
.bb-card.off .bb-art{filter:grayscale(.85) brightness(.7)}
.bb-cl{max-width:270px;font:600 15px/1.3 var(--ui);color:var(--cream2);text-wrap:balance}
.bb-cost{font:700 13px/1 var(--ui);letter-spacing:.24em;color:var(--dim)}
.bb-card .bb-buy{max-width:270px}
.bb-card .bb-need{text-align:center}

/* ---- подвал ---- */
.bb-foot{margin-top:4px;font:600 12px/1.4 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:rgba(233,201,142,.72);text-wrap:balance}

/* ---- закрытие, «назад», подсказка «ещё бонусы» ---- */
.bb .bb-x{position:absolute;right:max(10px,var(--sa-r,0px));top:10px;z-index:3;width:48px;height:48px}
.bb .bu-x .bu-screw{width:34px;height:34px;margin:-17px 0 0 -17px}
.bb-back{position:absolute;left:12px;top:12px;z-index:3;display:grid;place-items:center;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:50%;cursor:pointer;color:var(--amber);
 background:var(--plate);box-shadow:inset 0 0 0 1.5px var(--brass),0 0 0 1px var(--edge),0 4px 10px rgba(0,0,0,.5)}
.bb-back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-left:-2px}
.bb-back:hover{filter:brightness(1.15)}
.bb-more{position:absolute;left:50%;bottom:10px;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:7px 14px 6px;border-radius:999px;transform:translateX(-50%);pointer-events:none;white-space:nowrap;
 font:700 12px/1 var(--ui);letter-spacing:.24em;color:var(--amber);background:rgba(12,4,3,.88);box-shadow:inset 0 0 0 1px rgba(201,138,44,.55)}
.bb-more svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bb-more[hidden]{display:none}

/* ---- второй шаг покупки: одна большая карточка ---- */
.bb-conf{display:flex;justify-content:center;width:100%}
.bb-card.big{gap:14px;width:min(380px,100%)}
.bb-card.big .bb-pl{min-width:min(300px,100%);padding:11px 24px 10px}
.bb-card.big .bb-cn{font-size:28px}
.bb-card.big .bb-cs{font-size:13px}
.bb-card.big .bb-art{width:240px}
.bb-card.big .bb-cl{max-width:340px;font-size:17px}
.bb-tag{display:inline-flex;align-items:baseline;flex-wrap:wrap;justify-content:center;gap:4px 10px;max-width:100%;padding:10px 20px 9px;border-radius:6px;background:var(--plate);box-shadow:var(--plate-sh)}
.bb-tag span{font:700 14px/1 var(--ui);letter-spacing:.22em;color:var(--cream2)}
.bb-tag i{font-style:normal;color:var(--dim)}
.bb-tag b{font:400 23px/1 var(--rus);color:var(--amber);white-space:nowrap}
.bb-card.big .bb-buy{max-width:320px;min-height:56px;font-size:22px;letter-spacing:.14em}

/* ---- телефон стоя и узкое окно: всё в одну колонку с прокруткой ---- */
@media (max-width:640px){
 .bb-in{padding:12px 14px 52px}
 .bb-col{gap:14px}
 .bb-top{width:100%;gap:10px}
 .bb-h{font-size:30px;padding:6px 46px 0}
 .bb-mode{grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"ic mt mp" "go go go";gap:10px 12px;padding:10px}
 .bb-ic{width:52px;height:52px}
 .bb-mn{font-size:17px}
 .bb-chip{display:table;margin:5px 0 0}
 .bb-ml{font-size:14px}
 .bb-mp b{font-size:20px}
 .bb-mode .bb-go{width:100%}
 .bb-cards{grid-template-columns:minmax(0,320px);gap:30px}
 .bb-card.big .bb-art{width:min(220px,70%)}
 .bb-card.big .bb-cn{font-size:24px}
}
/* ---- низкое окно (телефон боком): название и ставка в одну строку, карточки — картинка слева, текст справа ---- */
@media (max-height:560px){
 .bb-in{padding:8px 64px 10px}
 .bb-col{gap:9px}
 .bb-top{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px 18px}
 .bb-h{font-size:28px;padding:0}
 .bb-key{width:44px;height:40px}
 .bb-bv{min-width:96px}.bb-bv small{font-size:10px}.bb-bv b{font-size:20px}
 .bb-g{gap:8px}
 .bb-lab{font-size:12px}
 .bb-mode{grid-template-columns:44px minmax(0,1fr) auto minmax(130px,auto);grid-template-areas:"ic mt mp go";gap:4px 12px;padding:6px 8px 6px 6px}
 .bb-ic{width:44px;height:44px}
 .bb-mn{font-size:16px}
 .bb-chip{display:inline-block;margin:0 0 0 8px;vertical-align:2px;font-size:10px}
 .bb-ml{font-size:13px;margin-top:2px}
 .bb-mp b{font-size:18px}.bb-mp small{font-size:10px}
 .bb-go{min-height:44px;font-size:14px;padding:4px 12px}
 .bb-mode .bb-go{width:auto}
 .bb-cards{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:10px 18px;max-width:740px} /* у auto-fit с потолком 360px помещалась одна колонка: ряд считается по потолку */
 .bb-card{display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-areas:"art pl" "art cl" "art cost" "go go" "nd nd";align-items:center;justify-items:start;gap:4px 12px;text-align:left}
 .bb-pl{grid-area:pl;align-items:flex-start;min-width:0;padding:5px 10px 4px}
 .bb-cn{font-size:16px}.bb-cs{font-size:10px;letter-spacing:.16em}
 .bb-art{grid-area:art;width:92px;align-self:start}
 .bb-cl{grid-area:cl;font-size:13px;line-height:1.2}
 .bb-cost{grid-area:cost;font-size:11px}
 .bb-card .bb-buy{grid-area:go;max-width:none;margin-top:2px}
 .bb-card .bb-need{grid-area:nd;justify-self:center}
 .bb-foot{margin-top:0;font-size:11px;letter-spacing:.14em}
 .bb .bb-x{top:4px;width:44px;height:44px}
 .bb .bu-x .bu-screw{width:30px;height:30px;margin:-15px 0 0 -15px}
 .bb-back{top:6px;left:8px}
 .bb-more{bottom:6px}
 /* второй шаг: картинка слева, всё остальное справа */
 .bb-card.big{width:min(560px,100%);grid-template-columns:150px minmax(0,1fr);grid-template-areas:"art pl" "art cl" "art tag" "art go";gap:8px 18px}
 .bb-card.big .bb-art{width:150px;align-self:center}

 .bb-card.big .bb-tag{grid-area:tag;padding:7px 14px 6px}.bb-tag b{font-size:19px}.bb-tag span{font-size:12px}
 .bb-card.big .bb-buy{grid-area:go;min-height:48px;font-size:18px}
}
/* ---- маленькое низкое окно (400×225, 320×180): одна колонка, мельче, винт и «назад» не наезжают на название ---- */
@media (max-height:560px) and (max-width:640px){

 .bb-h{font-size:21px}
 .bb-bv b{font-size:17px}

 .bb-mn{font-size:14px}.bb-ml{font-size:12px}
 .bb-mode .bb-go{width:100%}
 .bb-cards{grid-template-columns:minmax(0,420px)}
 .bb-card{grid-template-columns:72px minmax(0,1fr)}
 .bb-art{width:72px}

/* Коллект (collect.js): полёты символов, вмятины на ткани, свет во рту, крошки */
.cfly{position:fixed;z-index:70;pointer-events:none;will-change:transform,opacity}
.cfly img{width:100%;height:100%;object-fit:contain;display:block}
.cdent{position:absolute;pointer-events:none;opacity:0;background:radial-gradient(ellipse 46% 40% at 50% 54%,rgba(10,4,2,.5),rgba(10,4,2,.18) 55%,rgba(10,4,2,0) 75%)}
/* лапа (collect.js: paw1 «Горсть», paw2 «Хваты»): контейнер совпадает с сеткой поля и обрезает руку по краю — она выезжает «из-за рамки» */
#cpawclip{position:fixed;display:none;overflow:hidden;z-index:71;pointer-events:none}
#cpawclip .cpaw{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#cpawclip .cpaw-hand{position:absolute;display:block;will-change:transform} /* кисть — холст, тень нарисована в нём (collect.js setFrame); раньше: фон со сдвигом + CSS-фильтр, перерисовка слоя на каждом кадре сжатия */
#cpawclip .cpaw-arm{position:absolute;background-repeat:repeat-y;transform-origin:50% 0} /* предплечье — полоса меха paw2-arm.webp (своя прозрачность по краям, дальше от руки темнее: тень рамки; шва с ладонью нет, tools/paw_rebuild.py) */
#cpawclip .cpaw-heap{position:absolute;left:0;top:0;width:0;height:0} /* куча символов в ладони (между ладонью и пальцами): дети корня лапы едут вместе с ней */
#cpawclip .csh{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at center,rgba(6,3,2,.9),rgba(6,3,2,.42) 52%,rgba(6,3,2,0) 74%)} /* мягкая тень символа на ладонь и нижние символы */
#cpawclip .cpaw-sh{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.85),rgba(0,0,0,.45) 45%,rgba(0,0,0,0) 72%);will-change:transform,opacity}
#cpawclip .cpuff{position:absolute;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(216,203,168,.5),rgba(216,203,168,.18) 55%,rgba(216,203,168,0) 72%)}
#cpawclip .cpress{position:absolute;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(ellipse 50% 42% at 50% 50%,rgba(8,3,2,.6),rgba(8,3,2,.28) 55%,rgba(8,3,2,0) 78%)}

.cmouth{position:fixed;left:0;top:0;width:1px;height:1px;pointer-events:none} /* контейнер символа, входящего в рот: маска — контур нутра пасти по кадру ролика (collect.js dropIn) */

/* ===== подсветка выигрыша: «Лампочки», «Прожектор», «Неон», «Хлопок» (hl.js, 2026-10-12; «Камера» — в ui.css «подсветка выигрыша») =====
   Слои hl.js лежат внутри #hlu (под символами, z 3) и #hlx (над символами, z 5); размеры и места — в процентах поля, пересчёта при ресайзе не нужно.
   Двигаются только transform и opacity; итоговая картинка — обычные стили, анимации только «из» (hl.js). */
#hlu>.hlv,#hlx>.hlv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#hlu>.hlv{z-index:3}#hlx>.hlv{z-index:5}
.hlv.clip{overflow:hidden} /* слой по размеру проёма поля: лучи и затемнение не заходят на раму и на плашку множителя */
.hlv>*{position:absolute;pointer-events:none}
.hlv svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;display:block}
.hlv .hls{transform-origin:50% 0}
.hlv .hlk{opacity:0} /* конфетти: итог без анимации — пусто */

/* ---- сумма на поле: общее — старая тёмная «подушка» и мягкая тень не нужны, плашка рисует себя сама ---- */
#wlx .wl[data-wp]{text-shadow:none;gap:0}
#wlx .wl[data-wp]::before{display:none}
#wlx .wl[data-wp] .wf{position:relative;rotate:var(--rot,0deg);font-size:var(--fs)}
#wlx .wl[data-wp] .amt{position:relative;line-height:1;white-space:nowrap}

/* 1 · ценник на верёвочке: кремовая бумага с срезанными углами, красная печатная полоса, дырка и бечёвка к булавке */
#wlx .wl[data-wp=tag] .wf{padding-top:.62em;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 .05em 0 rgba(0,0,0,.6))}
#wlx .wl[data-wp=tag] .wf-s{position:absolute;left:50%;top:0;width:max(2px,.045em);height:.78em;margin-left:calc(max(2px,.045em)/-2);background:#8a6a3a}
#wlx .wl[data-wp=tag] .wf-s::before{content:"";position:absolute;left:50%;top:-.1em;width:.2em;height:.2em;margin-left:-.1em;border-radius:50%;background:#7a5a22;box-shadow:inset -.04em -.04em 0 rgba(0,0,0,.45)}
#wlx .wl[data-wp=tag]{--fs:calc(var(--amt,30px)*0.86)}

#wlx .wl[data-wp=tag] .amt::before{content:"";position:absolute;left:50%;top:.08em;width:.15em;height:.15em;margin-left:-.075em;border-radius:50%;background:#14100e;box-shadow:0 0 0 .03em #8c7d5a}

/* 2 · штамп: ржавые чернила на бумажной наклейке, неровные края и пятна (фильтр), двойная рамка */
#wlx .wl[data-wp=stamp] .wf{background:#d8cba8;padding:.1em}
#wlx .wl[data-wp=stamp]{--fs:calc(var(--amt,30px)*0.94)}
#wlx .wl[data-wp=stamp] .amt{font:700 var(--fs)/1 "WF Stardos",Impact,sans-serif;color:#8e2f24;padding:.08em .3em .04em;border:.065em solid #8e2f24;letter-spacing:.03em;filter:url(#wf-ink)}

/* 3 · перекидные цифры: тёмное табло, каждая цифра в своей клетке с линией сгиба */
#wlx .wl[data-wp=flip]{--fs:calc(var(--amt,30px)*.88)}

#wlx .wl[data-wp=flip] .c::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(1px,.025em);background:#090706}

#wlx .wl[data-wp=flip] .c.p::after{display:none}

#wlx .wl[data-wp=flip] .amt:not(:has(.c)){padding:0 .1em}

/* 4 · чековая лента: тёплая бумага, подпись WIN, зубчатый край снизу (clip-path задаёт winfx.js), печатается «лесенкой» */

 background-image:url(assets/uikit/hud-m1-chips.webp?bpv=f243623a),url(assets/uikit/hud-m1-wear.webp?bpv=397f1991),url(assets/uikit/hud-m1-grain.webp?bpv=a92e4f72),linear-gradient(180deg,var(--och1),var(--och2) 52%,var(--och3));background-blend-mode:multiply,soft-light,overlay,normal;background-size:48px 48px,auto,auto,auto;
 box-shadow:inset 0 0 0 1px var(--oxb),inset 0 -1px 1.5px rgba(40,20,4,.4),0 0 0 1px var(--edge);
 font:400 max(10px,calc(13*var(--p)))/1 "Black Ops One",Impact,sans-serif;letter-spacing:.12em;text-indent:.12em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 0 var(--lsh);white-space:nowrap}
/* тёмное окно: цифры справа, барабаны режутся краем окна; плотная тень цифр вниз, без свечения */
#result .wn{position:relative;display:flex;align-items:center;justify-content:flex-end;overflow:hidden;box-sizing:border-box;flex:none;height:calc(25*var(--p));min-width:calc(86*var(--p));padding:0 calc(6*var(--p)) 0 calc(5*var(--p));border-radius:calc(2*var(--p));
 background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 0 0 1px var(--grim),inset 0 calc(2*var(--p)) calc(3*var(--p)) rgba(0,0,0,.55),0 0 0 1px var(--edge);
 font:400 calc(19*var(--p))/1 "Black Ops One",Impact,sans-serif;color:var(--dg);text-shadow:0 calc(1.5*var(--p)) 0 rgba(0,0,0,.95)}
#result b{display:flex;align-items:center;justify-content:flex-end;height:100%;color:var(--dg);font-weight:400;white-space:nowrap}
#result b .od{display:inline-flex;height:1.15em;overflow:hidden;vertical-align:bottom;position:relative;top:0;line-height:1.15}
#result b .dc{display:block;width:.78em;height:1.15em;overflow:hidden;text-align:center}
#result b .dc+.dc{box-shadow:inset 1px 0 0 rgba(58,18,10,.9),-1px 0 0 rgba(160,125,55,.12)} /* столбики-разделители барабанов, как у цифр окошек М1 */
#result b .dcs{display:flex;flex-direction:column}
#result b .dcs i{display:block;height:1.15em;font-style:normal}
#result b .dch{display:block;height:1.15em}

/* ---- цепочка ---- */
#wfx-chain{position:absolute;pointer-events:none;z-index:6}
.wfx-tag{display:flex;align-items:baseline;gap:.3em;padding:.16em .5em .1em .45em;background:#8e2f24;color:#e9dcb8;font-family:"WF Stardos",Impact,sans-serif;font-weight:700;line-height:1;transform:translate(0,-50%) rotate(-2deg);transform-origin:0 50%;box-shadow:0 .08em 0 rgba(0,0,0,.65);clip-path:polygon(0 0,100% 0,calc(100% - .2em) 50%,100% 100%,0 100%);white-space:nowrap}
.wfx-tag i{font-style:normal;font-size:.62em;letter-spacing:.18em}
.wfx-tag b{font-weight:700;font-size:1.15em}
.wfx-lamps{display:flex;gap:calc(var(--ls,8px)*.55);transform:translateX(-50%)}
.wfx-lamps i{display:block;width:var(--ls,8px);height:var(--ls,8px);border-radius:50%;background:#2a1d17;box-shadow:inset 0 0 0 max(1px,calc(var(--ls,8px)*.14)) #0c0806}
.wfx-lamps i.on{background:#e8a93c;box-shadow:inset 0 0 0 max(1px,calc(var(--ls,8px)*.14)) #8a5a18}

/* ---- малый и средний выигрыш (без света: толчок, осадка, пыль, чёрточки) ---- */
.wfx-dust i{border-radius:0}
.wfx-tally{position:absolute;display:flex;gap:.22em;align-items:center;transform:translate(-100%,-50%);pointer-events:none;z-index:6}
.wfx-tally i{display:block;width:max(2px,.09em);height:.95em;background:#e7dcba;opacity:.9;rotate:var(--r,0deg);box-shadow:.05em .05em 0 rgba(0,0,0,.6)}

/* ---- «касание»: полоска с суммой в руке Рокко (rocco-touch.js); слой под роликом Рокко, пальцы лежат поверх ---- */
.wfx-slip{position:absolute;z-index:5;pointer-events:none;background:#1a1411;padding:.12em .55em .1em .45em;clip-path:polygon(0 0,100% 0,calc(100% - .14em) 50%,100% 100%,0 100%);border-top:max(1px,.03em) solid rgba(255,255,255,.12);white-space:nowrap;transform:rotate(-2deg)}
.wfx-slip b{display:block;font:400 1em/1 "WF Squada",Impact,sans-serif;color:#efe6cc;letter-spacing:.08em;text-shadow:-.03em -.03em 0 rgba(0,0,0,.75),.03em .03em 0 rgba(255,255,255,.14)}

/* ===== Плашки «Записка на плите» (владелец 2026-10-12: направление 1 из plates-all.html; «без нейрослопа, рамки по цвету как рамка слота») =====
   Включается атрибутом <html data-plates="note"> (plates-note.js; по умолчанию note, ?plates=old или тест-панель возвращают прежний вид). Всё ниже — только под этим атрибутом: без него ни одно старое правило не тронуто.
   Что это: плита и записка. ПЛИТА — тот же материал, что у рамки слота: потёртая красно-ржавая краска (assets/uikit/hud-m1-rust.webp?bpv=7da0f75f, вырезана из ui2/frame1.webp и прогнана через фильтр .frm рамки поля) со сколами hud-m1-wear/grain и тонкой латунной линией внутри, как у плашек М1.
   ЗАПИСКА — кремовая бумага (assets/plates-note/paper.webp?bpv=0b9b4844, нарисована кодом tools/note_textures.py: мелкое зерно и волокна, без пятен), края чуть неровные (clip-path у слоя бумаги, три варианта), под ней узкая плотная тень без свечения.
   Приклеена кусками малярного скотча (tape-a|b|c.webp: полупрозрачные, рваные концы): у каждой плашки свои куски, разной длины и под разными углами.
   Шрифты: Stardos Stencil — название, суммы, кнопки; Special Elite — подписи, абзацы, пункты (пишущая машинка). Деньги и важное — красными чернилами #8e2a1c, остальное — #241a12.
   Кнопка — печатная коробка на бумаге (рамка 2 px чернилами, без радиусов и теней), при наведении заливается чернилами. Минимальная цель нажатия 44 px.
   Состав: ворота бонуса (.bu-gate), итог бонуса (.bu-end), плашка Big Win / Max win (bigwin-show.js, data-pl=note), особые надписи в поле (+3 FREE SPINS, SACK…), записка-уведомление (#pn-toast), строка реплея (#bp-replay), выбор ставки (#bp-bets).
   Окна F (меню, правила, история, автоигра) — отдельный файл dialogs-f-note.css (живут в shadow DOM). Не тронуты: плашки М1, окно Buy bonus «Афиши». */

@font-face{font-family:"PN Elite";src:url(fonts/SpecialElite-Regular.ttf?bpv=3aae0bad) format("truetype");font-display:block}
@font-face{font-family:"PN Stardos";src:url(fonts/StardosStencil-Bold.ttf?bpv=8a572bee) format("truetype");font-weight:700;font-display:block}

html[data-plates=note]{
 --pn-paper:#dccfa9;--pn-ink:#241a12;--pn-ink2:#55402f;--pn-red:#8e2a1c;--pn-rule:rgba(36,26,18,.3);
 --pn-tex:url(assets/plates-note/paper.webp?bpv=0b9b4844) 0 0/360px auto;
 --pn-fe:"PN Elite","Special Elite",ui-monospace,monospace;--pn-fs:"PN Stardos","Stardos Stencil",Impact,sans-serif;
 --pn-fw:16px; /* толщина плиты вокруг записки */
 /* края бумаги: три чуть разных контура (clip-path), чтобы записки не были одним и тем же прямоугольником */
 --pn-cut1:polygon(.2% .7%,9% .1%,26% .6%,47% 0,71% .5%,90% .1%,99.7% .5%,100% 14%,99.5% 36%,100% 61%,99.6% 83%,100% 99.4%,84% 99.9%,63% 99.3%,38% 100%,17% 99.4%,.3% 99.8%,0 80%,.5% 58%,0 33%,.4% 12%);
 --pn-cut2:polygon(0 .4%,15% .9%,34% .2%,55% .7%,78% 0,99.8% .6%,99.4% 22%,100% 47%,99.6% 72%,100% 99.6%,81% 99.1%,58% 100%,31% 99.4%,10% 99.9%,.2% 99.2%,.7% 76%,0 51%,.5% 27%);
 --pn-cut3:polygon(.5% .2%,22% .8%,44% .1%,67% .6%,89% .2%,100% .9%,99.5% 28%,100% 54%,99.4% 79%,99.9% 99.2%,77% 99.7%,52% 99.1%,27% 100%,6% 99.5%,0 99.9%,.6% 66%,0 41%,.4% 17%);
}
@media (max-width:760px),(max-height:520px){html[data-plates=note]{--pn-fw:11px}}

/* ---------- общие слои: плита ---------- */
html[data-plates=note] :is(.bu-panel.bu-gate,.bu-panel.bu-end){
 --pn-cut:var(--pn-cut1);--pn-rot:-.35deg;--pn-pad:30px 30px 26px;
 box-sizing:border-box;width:min(520px,94%);margin:0;padding:var(--pn-fw);border:0;border-radius:0;border-image:none;color:var(--pn-ink);text-align:left;font-family:var(--pn-fe);
 background:url(assets/uikit/hud-m1-wear.webp?bpv=397f1991),url(assets/uikit/hud-m1-grain.webp?bpv=a92e4f72),linear-gradient(rgba(18,5,3,.18),rgba(18,5,3,.18)),url(assets/uikit/hud-m1-rust.webp?bpv=7da0f75f) 0 0/200px auto,#4a1a11;
 background-blend-mode:soft-light,overlay,normal,normal,normal;background-size:256px,256px,auto,200px auto,auto;
 box-shadow:0 0 0 1px #0a0302,inset 0 0 0 1px rgba(150,113,48,.42),0 14px 18px -8px rgba(0,0,0,.75)}
/* прежние слои рамки (внутренняя тень, винты) выключены; на их месте — куски скотча */
html[data-plates=note] .bu-panel:is(.bu-gate,.bu-end)::before,html[data-plates=note] .bu-panel:is(.bu-gate,.bu-end)::after{content:"";position:absolute;inset:auto;z-index:4;pointer-events:none;box-shadow:none;border-radius:0;
 background:var(--tp,url(assets/plates-note/tape-a.webp?bpv=d905b746)) 0 0/100% 100% no-repeat;filter:drop-shadow(0 1px 0 rgba(30,12,4,.35));width:var(--tw,78px);height:var(--th,26px);transform:rotate(var(--tr,-36deg))}
html[data-plates=note] .bu-panel.bu-gate{--tp:url(assets/plates-note/tape-a.webp?bpv=d905b746);--tw:80px;--th:27px;left:auto;--tr:-37deg}
html[data-plates=note] .bu-panel.bu-gate::before{left:-17px;top:3px}
html[data-plates=note] .bu-panel.bu-gate::after{--tp:url(assets/plates-note/tape-b.webp?bpv=e22e64cc);--tw:64px;--th:22px;--tr:31deg;right:-13px;top:2px}
html[data-plates=note] .bu-panel.bu-end{--pn-cut:var(--pn-cut2);--pn-rot:.3deg}
html[data-plates=note] .bu-panel.bu-end::before{--tp:url(assets/plates-note/tape-c.webp?bpv=1f851545);--tw:92px;--th:22px;--tr:-4deg;left:50%;margin-left:-30px;top:-8px}
html[data-plates=note] .bu-panel.bu-end::after{--tp:url(assets/plates-note/tape-b.webp?bpv=e22e64cc);--tw:54px;--th:19px;--tr:52deg;right:-12px;bottom:14px}

/* ---------- записка ---------- */
html[data-plates=note] :is(.bu-gate,.bu-end)>.bu-in{position:relative;isolation:isolate;max-height:none;padding:var(--pn-pad);text-align:left;background:none;box-shadow:none;border-radius:0;overflow:visible}
html[data-plates=note] :is(.bu-gate,.bu-end)>.bu-in::before,html[data-plates=note] :is(.bu-gate,.bu-end)>.bu-in::after{content:"";position:absolute;inset:0;z-index:-1;clip-path:var(--pn-cut);pointer-events:none}
html[data-plates=note] :is(.bu-gate,.bu-end)>.bu-in::before{inset:3px -1px -3px 1px;background:rgba(14,5,2,.55);filter:blur(2.5px);clip-path:none;border-radius:2px;transform:rotate(var(--pn-rot))}
html[data-plates=note] :is(.bu-gate,.bu-end)>.bu-in::after{background:var(--pn-tex),var(--pn-paper);transform:rotate(var(--pn-rot))} /* наклон — только у бумаги, текст на ней стоит ровно (повёрнутый мелкий текст теряет чёткость) */

/* ---------- текст записки ---------- */
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-tag{display:block;text-align:left;font:400 13px/1 var(--pn-fe);letter-spacing:.3em;text-transform:uppercase;color:var(--pn-red);margin:0 0 8px}
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-h{margin:0 0 14px;text-align:left;font:700 46px/1 var(--pn-fs);letter-spacing:.02em;text-transform:uppercase;color:var(--pn-ink);text-shadow:none;text-wrap:balance}
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-fit{width:100%;margin:0}
html[data-plates=note] .bu-panel.bu-gate .bu-hero{display:inline-flex;align-items:center;justify-content:flex-start;margin:0;padding:7px 14px 7px 10px;width:max-content;max-width:100%;gap:.4em;border-radius:0;background:none;box-shadow:none;border:3px solid var(--pn-red);text-shadow:none;
 font:700 clamp(21px,7.6cqi,30px)/1 var(--pn-fs);letter-spacing:.03em;color:var(--pn-red)}
html[data-plates=note] .bu-panel.bu-gate .bu-hero::after{content:none}
html[data-plates=note] .bu-panel.bu-gate .bu-hero img{height:1.7em;filter:sepia(.4) contrast(.92) brightness(.9) saturate(.85);mix-blend-mode:multiply;border-radius:0}
html[data-plates=note] .bu-gate .bu-list{max-width:none;margin:16px 0 0;text-align:left}
html[data-plates=note] .bu-gate .bu-list li{margin:0;padding:6px 0 6px 24px;font:400 16px/1.38 var(--pn-fe);color:var(--pn-ink);text-shadow:none}
html[data-plates=note] .bu-gate .bu-list li::before{left:0;top:calc(.69em + 6px);width:12px;height:2px;border-radius:0;background:var(--pn-ink);box-shadow:none}
html[data-plates=note] .bu-gate .bu-auto{margin:14px 0 0;font:400 14px/1.3 var(--pn-fe);letter-spacing:.06em;text-align:left;text-transform:uppercase;color:var(--pn-red);text-shadow:none}
html[data-plates=note] .bu-end .bu-total{display:block;padding:0;margin:0;border-radius:0;background:none;box-shadow:none;text-shadow:none;text-align:left;
 font:700 clamp(30px,calc((100cqi - 8px) / (var(--n,8) * .6)),62px)/1 var(--pn-fs);letter-spacing:.01em;color:var(--pn-red);font-variant-numeric:tabular-nums}
html[data-plates=note] .bu-end .bu-total::after{content:none}
html[data-plates=note] .bu-end .bu-cap{margin:10px 0 0;font:400 12px/1 var(--pn-fe);letter-spacing:.28em;text-transform:uppercase;color:var(--pn-ink2)}

/* ---------- кнопка: печатная коробка ---------- */
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-btns{display:flex;flex-direction:row;justify-content:flex-start;align-items:center;margin:24px 0 0;padding:0;gap:14px}
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:190px;min-height:48px;max-width:100%;margin:0;padding:0 26px;cursor:pointer;
 border:2px solid var(--pn-ink);border-radius:0;background:transparent;box-shadow:none;filter:none;text-shadow:none;color:var(--pn-ink);font:700 22px/1 var(--pn-fs);letter-spacing:.07em;text-transform:uppercase;transition:background .12s,color .12s}
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens::before,html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens::after{content:none}
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens:hover{background:var(--pn-ink);color:var(--pn-paper);filter:none}
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens:focus-visible{outline:0;background:var(--pn-ink);color:var(--pn-paper);filter:none} /* ворота ставят фокус на CONTINUE сами: фокус = заливка чернилами (видно, без второй рамки); на наведении то же */
html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens:active{transform:translateY(1px);box-shadow:none}

/* телефон */
@media (max-width:760px){
 html[data-plates=note] :is(.bu-panel.bu-gate,.bu-panel.bu-end){--pn-pad:24px 20px 20px}
 html[data-plates=note] :is(.bu-gate,.bu-end) .bu-h{font-size:34px;margin-bottom:12px}
 html[data-plates=note] .bu-gate .bu-list li{font-size:14.5px;padding-left:20px}
 html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens{min-width:0;flex:1 1 auto;font-size:20px}
 html[data-plates=note] :is(.bu-gate,.bu-end)>.bu-in{padding:var(--pn-pad)}
 html[data-plates=note] .bu-panel.bu-gate::before{left:-13px}
 html[data-plates=note] .bu-panel.bu-gate::after{right:-9px}
}
@media (max-height:520px){
 html[data-plates=note] :is(.bu-panel.bu-gate,.bu-panel.bu-end){--pn-pad:16px 22px 14px;width:min(640px,94%)}
 /* телефон боком: ворота в две колонки — слева название, условие и кнопка, справа пункты (иначе длинные «Камеры» не влезают по высоте) */
 html[data-plates=note] .bu-panel.bu-gate{width:min(720px,94%)}
 html[data-plates=note] .bu-gate>.bu-in{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);grid-template-rows:auto auto auto 1fr auto;column-gap:26px;align-items:start;grid-template-areas:"tag list" "h list" "fit list" "auto list" "btns list"}
 html[data-plates=note] .bu-gate .bu-tag{grid-area:tag}
 html[data-plates=note] .bu-gate .bu-h{grid-area:h}
 html[data-plates=note] .bu-gate .bu-fit{grid-area:fit}
 html[data-plates=note] .bu-gate .bu-list{grid-area:list;margin:0;align-self:center}
 html[data-plates=note] .bu-gate .bu-auto{grid-area:auto}
 html[data-plates=note] .bu-gate .bu-btns{grid-area:btns;align-self:end}
 html[data-plates=note] :is(.bu-gate,.bu-end) .bu-h{font-size:32px;margin-bottom:8px}
 html[data-plates=note] .bu-gate .bu-list{margin-top:8px}
 html[data-plates=note] .bu-gate .bu-list li{padding:3px 0 3px 22px;font-size:14px}
 html[data-plates=note] .bu-gate .bu-list li::before{top:calc(.69em + 3px)}
 html[data-plates=note] :is(.bu-gate,.bu-end) .bu-btns{margin-top:12px}
 html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens{min-height:46px;font-size:19px}
 html[data-plates=note] .bu-panel.bu-gate .bu-hero{padding:4px 12px 4px 8px}
}
@media (prefers-reduced-motion:reduce){html[data-plates=note] :is(.bu-gate,.bu-end) .bu-lens{transition:none}}

/* =====================================================================================================================
   Малые плашки: особые надписи в поле (.wl.ev — ui.js special(): +3 FREE SPINS, SACK, TOSS, PUNCH…), записка-уведомление #pn-toast (bpPlates.toast, ui.js flash()), строка реплея #bp-replay, список ставок #bp-bets.
   Те же слои, что у больших: плита цвета рамки слота → кремовая бумага (слой ::before) → печатный текст; скотч — у каждой свой.
   ===================================================================================================================== */
html[data-plates=note]{
 --pn-rustbg:url(assets/uikit/hud-m1-wear.webp?bpv=397f1991),url(assets/uikit/hud-m1-grain.webp?bpv=a92e4f72),linear-gradient(rgba(18,5,3,.18),rgba(18,5,3,.18)),url(assets/uikit/hud-m1-rust.webp?bpv=7da0f75f) 0 0/200px auto,#4a1a11;
}
/* ---------- особые надписи в поле ---------- */
html[data-plates=note] #wlx .wl.ev{--F:max(4px,calc(var(--amt,30px)*.1));box-sizing:border-box;gap:calc(var(--amt,30px)*.1);padding:calc(var(--F) + var(--amt,30px)*.24) calc(var(--F) + var(--amt,30px)*.5);text-shadow:none;
 background:var(--pn-rustbg);background-blend-mode:soft-light,overlay,normal,normal,normal;background-size:256px,256px,auto,200px auto,auto;
 box-shadow:0 0 0 1px #0a0302,inset 0 0 0 1px rgba(150,113,48,.42),0 calc(var(--amt,30px)*.1) calc(var(--amt,30px)*.18) calc(var(--amt,30px)*-.06) rgba(0,0,0,.75)}
html[data-plates=note] #wlx .wl.ev::before{content:"";position:absolute;left:var(--F);right:var(--F);top:var(--F);bottom:var(--F);z-index:-1;background:var(--pn-tex),var(--pn-paper);clip-path:var(--pn-cut3)}
html[data-plates=note] #wlx .wl.ev::after{content:"";position:absolute;z-index:2;left:calc(var(--amt,30px)*-.24);top:calc(var(--amt,30px)*-.1);width:calc(var(--amt,30px)*1.55);height:calc(var(--amt,30px)*.52);background:url(assets/plates-note/tape-b.webp?bpv=e22e64cc) 0 0/100% 100% no-repeat;transform:rotate(-33deg);filter:drop-shadow(0 1px 0 rgba(30,12,4,.35));pointer-events:none}
html[data-plates=note] #wlx .wl.ev .amt{font:700 calc(var(--amt,30px)*.84)/1 var(--pn-fs);letter-spacing:.02em;color:var(--pn-red);text-shadow:none}

/* ===== Плашки «Тёмные» (владелец 2026-10-12: выбрал вид окон F — «такие плашки оставь везде») =====

   Окна F (Меню, Правила, История, Autoplay) и список ставок в этом режиме — прежние (dialogs-f.css, ui.css), правок нет. Здесь — те же ингредиенты для остальных плашек игры:
   тёмно-коричневое тело (#22120b → #1b0e09) · тонкая рама dlg-frame.png (по бокам и снизу) · сверху потёртая красная стальная лента dlg-band.png с крошечным винтом (dlg-screw.svg) — винты только в ленте ·
   охристое название Black Ops One (#FFC861) · мелкие подписи Black Ops One капсом цвета #CDB27C · тонкая охристая линия с точками на концах · тёмные ячейки с тонкой рамкой 1.5 px ·
   выбранное / главная кнопка — плоская охра #F0D890 с тёмным текстом. Без свечения, без глянцевых градиентов, без текста с тенью.
   Состав: ворота бонуса (.bu-gate), итог бонуса (.bu-end), особые надписи в поле (.wl.ev), записка-уведомление (#pn-toast), строка реплея (#bp-replay). Плашка Big Win / Max win — вариант data-pl=dlg в bigwin-show.js (те же значения). Не тронуты: плашки М1, окно Buy bonus «Афиши». */

html[data-plates=dark]{
 --pd-ttl:#FFC861;--pd-tx:#EFE2B2;--pd-tx2:#CDB27C;--pd-cream:#F6ECB4;--pd-cream2:#F0D890;--pd-dk:#2a0f06;--pd-line:rgba(240,200,140,.24);--pd-focus:#fff4c4;
 --pd-disp:"Black Ops One",Impact,sans-serif;--pd-body:"Barlow SC","Barlow Semi Condensed",system-ui,sans-serif;

 /* линия с точками на концах (как .dv в dialogs-f.css) */
 --pd-dv:radial-gradient(circle at 35% 30%,#f6dcae 0 1px,#b8793f 2.4px,#4b2410 3.6px,#1a0a04 4px,transparent 4.3px) 0 50%/9px 9px no-repeat,
  radial-gradient(circle at 35% 30%,#f6dcae 0 1px,#b8793f 2.4px,#4b2410 3.6px,#1a0a04 4px,transparent 4.3px) 100% 50%/9px 9px no-repeat,
  linear-gradient(90deg,rgba(201,138,44,.2),rgba(201,138,44,.78) 14%,rgba(201,138,44,.78) 86%,rgba(201,138,44,.2)) 50% 50%/calc(100% - 26px) 1px no-repeat;
}

   Для всех окон F: Меню, Правила, История и (дальше) окон бонусов, автоигры. Имена классов ниже НЕ менять — только добавлять новые.
   Окно живёт в shadow DOM: стили игры его не задевают, а эти — игру. JS-помощники лежат в dialogs-f.js (window.DlgF):
     DlgF.shell(host, popup, extraCss) -> {sh, stage, layer}   кладёт стили и сцену в shadow-корень host (extraCss — свои стили окна, добавляются после этих);
     DlgF.frame(kind, title, bodyHTML, footHTML)               разметка окна с лентой, винтом, названием и разделителями (ниже);
     DlgF.trap(sh) · DlgF.rise(dlg) · DlgF.follow(host, stage) · DlgF.socialize(root) · DlgF.screw() · DlgF.moneyH(ctx, v)   фокус по кругу, появление 240 мс, режим экрана, замена слов stake.us, винт, сумма с кодом валюты.
   Разметка внутри shadow-корня:
     <div id="stage" data-mode="desk|phone|land" data-nav="top|side" [data-long] [class="pop"]>   сцена на всё окно браузера; .pop — выезжающее меню (по размеру содержимого)
       <div class="layer">                                                               по центру (grid)
         <div class="dlg dlg-NAME [muted]" tabindex="-1">                                рама (border-image ../assets/ui2/dlg-frame.webp), коричневая плита (схема 2 «Ржавая жилка»), тень; ширина и высота — по режимам ниже
           <div class="face">
             <header class="hd"><button class="x" aria-label="Close"><svg class="scr">винт</svg></button></header>   пустая красная лента пульта (dlg-band.png); .x — область нажатия 44×44, винт по центру ленты
             <div class="bd">                                                            прокручиваемое тело
               <div class="ttl"><h2 id="dlgT">Название</h2></div>                        название на плите: Black Ops One, золото #FFC861, чёрная тень
               <div class="dv dt"></div>                                                 разделитель: латунная линейка с заклёпками на концах
               …содержимое: .m-cols (меню) · .r-wrap > .tabs + .dv.dn + .pane (правила) · .h-wrap (история) · свой блок…
             </div>
             <div class="dv df"></div><footer class="ft">…</footer>                      подвал, необязателен
     Классы содержимого: .row .lb (строка настроек и её подпись) · .seg (группа кнопок) · .go (плиточная кнопка) · .tab (вкладка-канал) · .pane/.pb (текст) · .chips · .sym/.buy · .rp (кнопка в строке) · .ft.
   Вид — один (выбор владельца 2026-10-11): шрифты набора 2 (Black Ops One мелко для подписей, вкладок, названий символов, сумм и заголовков таблиц + Barlow для абзацев), разделители — латунная линейка с заклёпками.
   Переменные шрифтов (--ui подписи и кнопки, --body абзацы, --num числа, поправки --kl --kb --kn) и разделителей (--dlg-line, --dlg-line-hi, --row-bd, --row-sh) заданы в :host и #stage — окна бонусов и автоигры используют те же.
   Переключатели для сравнения: ?dlgnav=top|side — вкладки правил сверху или колонкой слева с Рокко;  ?dlg=old — прежние окна-мониторы.
   Размеры по режимам: --hdh высота ленты, --fw толщина рамы, --sw винт, --ttlh плита с названием, --tfs название, --phs заголовок раздела (ПК 24/9/27/54/28/23, телефон 18/6.5/21/50/23/20, лёжа 16/6/19/44/21/18).
   Цвет разделителей и рамки — переменные --dlg-line, --dlg-line-hi, --row-bd, --row-sh, --dlg-frame в :host (смена — одна строка). */
:host{--cream:#F6ECB4;--cream2:#F0D890;--amber:#F0C078;--lit:#F8EEB8;--tx:#EFE2B2;--tx2:#CDB27C;--dark:#2a0f06;
 --ease:cubic-bezier(.2,.8,.2,1);--dlg-line:rgba(8,3,1,.6);--dlg-line-hi:rgba(255,225,170,.07);--row-bd:1px solid rgba(201,138,44,.2);--row-sh:none;--dlg-frame:url(assets/ui2/dlg-frame.webp?bpv=ccd1fa04) 92 80 92 80 round;--line:rgba(240,200,140,.24);--fade:#1b0e09;
 --disp:"Black Ops One",Impact,sans-serif;--ttl:#FFC861;
 --barlow:"Barlow SC","Barlow Semi Condensed",system-ui,sans-serif;--vt:"VT323",ui-monospace,monospace;
 font-synthesis:none}
*{box-sizing:border-box}
[hidden]{display:none!important}

/* ---------- шрифты (набор 2): --ui — подписи, вкладки, кнопки, названия символов, заголовки таблиц; --body — абзацы; --num — суммы и числа. --kl / --kb / --kn — поправки размера (у Black Ops One буквы крупнее) ---------- */
#stage{--ui:"Black Ops One",Impact,sans-serif;--body:var(--barlow);--num:"Black Ops One",Impact,sans-serif;--kl:.84;--kb:1;--kn:.74}

/* ---------- сцена: во всё окно браузера, окно по центру ---------- */
#stage{position:absolute;inset:var(--sa-t,0px) var(--sa-r,0px) var(--sa-b,0px) var(--sa-l,0px);overflow:hidden;pointer-events:none} /* окно стоит в безопасной области: --sa-* приходят из документа (:root в index.html) и без выреза равны 0 */
.layer{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;pointer-events:none}
.dlg{pointer-events:auto;position:relative;display:flex;flex-direction:column;min-height:0;max-height:calc(100% - 16px);color:var(--tx);font-family:var(--body);font-size:calc(17px*var(--kb));line-height:1.5;
 border-style:solid;border-color:transparent;border-width:0 calc(var(--fw)*.87) var(--fw);border-image:var(--dlg-frame);border-radius:0;
 background:linear-gradient(180deg,#22120b,#1b0e09);background-clip:padding-box;background-origin:padding-box;
 box-shadow:0 0 0 1px #0a0302,0 40px 70px rgba(0,0,0,.6)}
.dlg:focus,.dlg:focus-visible{outline:0}
.dlg *{box-sizing:border-box}
:where(.dlg button,.dlg select,.dlg input){font:inherit;color:inherit}
:where(.dlg button){cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:where(.dlg p){margin:0 0 .8em}
:where(.dlg h2,.dlg h3,.dlg h4){margin:0;font-weight:inherit}
.dlg select option{background:#1d0e0a;color:#f0e4b8}
.dlg :focus-visible{outline:3px solid #fff4c4;outline-offset:2px}
.dlg .tab:focus-visible,.dlg .go:focus-visible,.dlg .next:focus-visible{outline-offset:-3px}
.dlg input[type=range]:focus-visible{outline:none}
svg{flex:none}
.face{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:0;background:linear-gradient(180deg,#22120b,#1b0e09)}
/* лёгкая развёртка поверх плиты (не на ленте) */
.face::after{content:"";position:absolute;left:0;right:0;bottom:0;top:var(--hdh);z-index:6;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.085) 0 1px,transparent 1px 3px)}
.bd{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.dlg-rules .bd,.dlg-hist .bd{overflow:hidden}

/* размеры по режимам: --hdh высота ленты, --fw толщина рамы, --sw винт, --ttlh плита с названием, --tfs название, --phs заголовок раздела */
#stage{--hdh:24px;--fw:9px;--sw:17px;--ttlh:54px;--tfs:28px;--phs:23px}
#stage[data-mode=phone]{--hdh:18px;--fw:6.5px;--sw:13px;--ttlh:50px;--tfs:23px;--phs:20px}
#stage[data-mode=land]{--hdh:16px;--fw:6px;--sw:12px;--ttlh:44px;--tfs:21px;--phs:18px}
#stage[data-mode=desk] .dlg-menu{width:424px}
#stage[data-mode=desk] .dlg-rules{width:min(1060px,calc(100% - 64px));height:min(840px,calc(100% - 24px))}
#stage[data-mode=desk] .dlg-hist{width:min(800px,calc(100% - 64px));height:min(840px,calc(100% - 24px))}
#stage[data-mode=phone] .dlg{width:calc(100% - 20px);max-height:calc(100% - 20px)}
#stage[data-mode=phone] .dlg-rules,#stage[data-mode=phone] .dlg-hist{height:calc(100% - 20px)}
#stage[data-mode=phone] .dlg-menu{width:min(calc(100vw - var(--sa-l,0px) - var(--sa-r,0px) - 16px),392px);max-height:none}
#stage[data-mode=land] .dlg-menu{width:min(calc(100vw - var(--sa-l,0px) - var(--sa-r,0px) - 24px),580px);max-height:none}
#stage[data-mode=land] .dlg-rules,#stage[data-mode=land] .dlg-hist{width:calc(100% - 24px);height:calc(100% - 16px)}
/* меню — выезжает из кнопки ≡ на пульте (его кладёт dialogs-f.js в #bp-menu): без центрирования и без рамки сцены */
#stage.pop{position:relative;inset:auto;width:max-content;height:auto;overflow:visible}
#stage.pop .layer{position:static;display:block}
#stage.pop .dlg{max-height:none}

/* ---------- лента (пустая, как рейка пульта) и винт ---------- */
.hd{position:relative;z-index:2;flex:none;height:var(--hdh);padding:0;background:url(assets/ui2/dlg-band.webp?bpv=a8b6ed1e) center/auto 100% repeat-x #8a1a0c;box-shadow:0 1px 0 #0a0302,0 3px 8px rgba(0,0,0,.5)}
.x{position:absolute;right:4px;top:0;width:44px;height:44px;margin:0;border-radius:0;background:none;box-shadow:none}
.x .scr{position:absolute;left:50%;top:calc(var(--hdh)/2);width:var(--sw);height:var(--sw);margin:calc(var(--sw)/-2) 0 0 calc(var(--sw)/-2);transition:filter .15s,transform .15s}
.x .scr .cross{transition:transform .28s var(--ease)}
.x:hover .scr{filter:brightness(1.18)}
.x:hover .scr .cross{transform:rotate(135deg)!important}
.x:active .scr{transform:scale(.94)}
.x:focus-visible{outline:0!important}
.x:focus-visible .scr{outline:3px solid #fff4c4;outline-offset:2px;border-radius:50%}

/* ---------- плита с названием ---------- */
.ttl{flex:none;display:flex;align-items:center;min-height:var(--ttlh);padding:0 30px 0 32px}
.ttl h2{font:400 var(--tfs)/1 var(--disp);letter-spacing:.05em;color:var(--ttl);margin-top:.1em}
.ph{font:400 var(--phs)/1.1 var(--disp);letter-spacing:.05em;color:var(--ttl);margin:0 0 12px}
.ft{position:relative;z-index:1;flex:none;display:flex;align-items:center;justify-content:center;gap:14px;min-height:52px;padding:0 24px;text-align:center;
 color:var(--tx2);font:700 max(12px,calc(13px*var(--kl)))/1 var(--ui);letter-spacing:.2em;text-transform:uppercase}
.ft i{width:5px;height:5px;transform:rotate(45deg);background:currentColor;opacity:.6}

/* суммы: валюта мельче, число не переносится */
.m{white-space:nowrap}
.m small{font-size:max(12px,.74em);letter-spacing:.06em;opacity:.8}
.xs,.ladder .xs{font-style:normal;font-family:var(--barlow);font-size:max(12px,.8em)}

/* ---------- меню ---------- */
.m-cols{display:flex;flex-direction:column;padding:4px 26px 24px}
.row{display:flex;align-items:center;gap:14px;min-height:54px;border-bottom:var(--row-bd);box-shadow:var(--row-sh)}
.m-set .row:last-child{border-bottom:0;box-shadow:none}
.row .lb{flex:none;width:92px}
.lb{font:700 max(12px,calc(13px*var(--kl)))/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--tx2)}
.row.spd,.row.lng,.row.sw{justify-content:space-between}
.tg{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:44px;min-width:92px;justify-content:flex-end}
.tg i{position:relative;flex:none;width:52px;height:30px;border-radius:3px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s}
.tg i::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:3px;background:#6d5a40;transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.tg[aria-checked=true] i{box-shadow:inset 0 0 0 1.5px var(--cream2)}
.tg[aria-checked=true] i::after{transform:translateX(22px);background:var(--cream);box-shadow:none}
.tgt{font:400 calc(26px*var(--kn))/1 var(--num);letter-spacing:.04em;color:var(--lit);min-width:2.2ch;text-shadow:none}
/* бегунок громкости: 10 делений, настоящий <input type=range> (мышь, касание, стрелки, Home/End работают как обычно) */
.vol input{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;width:100%;height:44px;margin:0;cursor:pointer;--tp:calc(var(--thw)/2 + (100% - var(--thw))*var(--n)/100);
 --trh:22px;--thw:6px;--thh:32px;--fill:var(--cream2);--empty:#3c2a1c;--ths:none}
input[type=range]::-webkit-slider-runnable-track{height:var(--trh);border-radius:0;background:linear-gradient(to right,var(--fill) var(--tp),var(--empty) var(--tp));-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 4px),transparent calc(10% - 4px) 10%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:var(--thw);height:var(--thh);margin-top:calc((var(--trh) - var(--thh))/2);border-radius:2px;background:var(--cream);border:0;box-shadow:var(--ths)}
input[type=range]::-moz-range-track{height:var(--trh);border-radius:0;background:linear-gradient(to right,var(--fill) var(--tp),var(--empty) var(--tp));mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 4px),transparent calc(10% - 4px) 10%)}
input[type=range]::-moz-range-thumb{width:var(--thw);height:var(--thh);border-radius:2px;background:var(--cream);border:0;box-shadow:var(--ths)}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:var(--ths),0 0 0 3px #fff4c4}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:var(--ths),0 0 0 3px #fff4c4}
.vol output{flex:none;min-width:3.4ch;text-align:right;font:400 calc(26px*var(--kn))/1 var(--num);color:var(--lit);text-shadow:none;font-variant-numeric:tabular-nums}
/* звук выключен: громкости серые и тусклее (как в игре: main d3ea8af) */
.dlg.muted .vol{opacity:.6;filter:grayscale(1);--fill:#8d877c;--ths:none}
.seg{display:flex;gap:8px}
.seg button{min-height:44px;padding:0 12px;border-radius:3px;font:700 calc(16px*var(--kl))/1 var(--ui);letter-spacing:.06em;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .15s,color .15s}
.seg button:hover{box-shadow:inset 0 0 0 1.5px var(--cream2);color:#fff}
.seg button[aria-pressed=true]{background:var(--cream2);color:var(--dark);box-shadow:none}
.sel{position:relative;display:inline-flex;align-items:center;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.sel select{-webkit-appearance:none;appearance:none;background:none;border:0;min-height:44px;padding:0 34px 0 14px;cursor:pointer;max-width:240px;font:700 calc(17px*var(--kl))/1 var(--ui);color:var(--lit);letter-spacing:.04em}
.sel select:focus{outline:none}
.sel:focus-within{outline:3px solid #fff4c4;outline-offset:2px}
.sel svg{position:absolute;right:10px;width:16px;height:16px;fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.m-go{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.go{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;text-align:left;border-radius:3px;color:var(--tx);font:700 calc(18px*var(--kl))/1.1 var(--ui);letter-spacing:.04em;box-shadow:inset 0 0 0 1.5px var(--line);transition:background .15s,color .15s,box-shadow .15s}
.go .gi{color:var(--amber)}
.go .gi svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.go .gt{flex:1;min-width:0}
.go:hover{background:var(--cream2);color:var(--dark);box-shadow:none}
.go:hover .gi{color:var(--dark)}

/* ---------- правила ---------- */
.r-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;gap:4px 10px;flex:none;padding:8px 22px}
.grp,.gg{display:contents}
.gl{display:none}
.tab{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:3px;white-space:nowrap;text-align:left;font:700 calc(16px*var(--kl))/1.1 var(--ui);letter-spacing:.02em;color:var(--tx);box-shadow:inset 0 0 0 1.5px transparent;transition:background .12s,color .12s,box-shadow .12s}
.tab .n{margin-right:9px;font:400 calc(21px*var(--kn))/1 var(--num);color:var(--amber);letter-spacing:.02em}
.tab[aria-selected=true] .n{color:#6a3a12}
.tab:hover{color:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.tab[aria-selected=true]{background:var(--cream2);color:var(--dark);box-shadow:none}
.pane{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#8a5a2a transparent;container-type:inline-size;padding:18px 32px 26px}
.pane:focus-visible{outline-offset:-3px}
/* низ прокручиваемого текста мягко уходит в цвет плиты */
.pane::after,.hl::after{content:"";display:block;clear:both;position:sticky;bottom:0;height:26px;margin-top:-26px;pointer-events:none;background:linear-gradient(transparent,var(--fade))}
.pb{display:flow-root}
.pb p{margin:0 0 .85em}
.pb b{color:var(--lit);font-weight:700}
.pb ol{list-style:none;counter-reset:s;margin:10px 0 14px;padding:0}
.pb ol li{counter-increment:s;position:relative;margin:0 0 .85em;padding-left:48px}
.pb ol li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:-1px;font:400 calc(26px*var(--kn))/1.25 var(--num);color:var(--amber);text-shadow:none}
.pb ul.ctl{list-style:none;margin:10px 0 14px;padding:0;display:grid;gap:12px}
.pb ul.ctl li{position:relative;padding-left:22px}
.pb ul.ctl li::before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;transform:rotate(45deg);background:var(--amber)}
.callout{margin:14px 0;padding:2px 0 2px 18px;border-left:2px solid var(--cream2);color:var(--tx2)}
.callout b{color:var(--lit)}
.ill{float:right;width:clamp(96px,26%,190px);height:auto;margin:0 0 12px 22px}
.next{display:inline-flex;align-items:center;gap:10px;min-height:44px;margin-top:18px;padding:0 8px;border-radius:3px;color:var(--amber);font:700 max(12px,calc(14px*var(--kl)))/1 var(--ui);letter-spacing:.16em;text-transform:uppercase}
.next b{color:var(--lit);letter-spacing:.05em;font-size:calc(16px*var(--kl));text-transform:none}
.next svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.next:hover{color:#fff;background:rgba(240,200,140,.1)}
/* таблицы (выплаты, RTP): разметка старых окон, оформление новое */
.pb table{width:100%;border-collapse:collapse;margin:6px 0 8px}
.pb table.pay{table-layout:fixed}
.pb table.pay th:nth-child(1){width:62px}
.pb table.pay th:nth-child(n+3){width:21%}
.pb th{font:700 max(12px,calc(12px*var(--kl)))/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--tx2);text-align:left;padding:0 6px 12px;border-bottom:var(--row-bd);box-shadow:var(--row-sh)}
.pb td{padding:4px 6px;border-bottom:var(--row-bd);vertical-align:middle;font:700 calc(18px*var(--kl))/1.15 var(--ui)}
.pb tr:last-child td{border-bottom:0}
.pb td img{display:block;width:42px;height:42px;object-fit:contain}
.pb td.n{text-align:right;white-space:nowrap;font:400 min(calc(27px*var(--kn)),calc(3.6cqw*var(--kn)))/1 var(--num);color:var(--tx);text-shadow:none;font-variant-numeric:tabular-nums}
.pb td.n:last-child{color:var(--lit)}
/* особые символы и покупка бонуса */
.sym,.buy{display:grid;grid-template-columns:58px minmax(0,1fr);gap:18px;align-items:start;padding:14px 0;border-bottom:var(--row-bd);box-shadow:var(--row-sh)}
.sym:last-child,.buy:last-child{border-bottom:0;box-shadow:none}
.sym img,.buy img{width:58px;height:54px;object-fit:contain}
.sym b,.buy b{display:block;font:700 calc(19px*var(--kl))/1.2 var(--ui);color:var(--lit)}
.sym p,.buy p{margin:3px 0 0;color:var(--tx2);font-size:.94em;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px 10px;margin:5px 0 3px}

<style id="bp-dlgframed" media="not all">
/* ================= «Плашка с чистым содержимым» (?dlg=framed, умолчание с 2026-10-13) =================
   Содержимое окон — как в чистом виде (dialogs-clean.css: названия по центру, подписи между линиями, строки-полосы, плитки, красные и латунные кнопки),
   но внутри прежней плашки окон F: тёмная плита, красная потёртая лента с винтом сверху, рама, прежние размер и место (dialogs-f.css).
   Подключается ПОСЛЕ dialogs-clean.css внутрь shadow-корня (dialogs-f.js shell(): <link id="bp-dlgframed" media="not all"> / <style id="bp-dlgframed">) и возвращает раму, ленту, плиту,
   развёртку и прежние размеры. Окно Autoplay не затрагивается (у него свой чистый вид). */
.dlg:is(.dlg-menu,.dlg-rules,.dlg-hist){position:relative;border-style:solid;border-color:transparent;border-width:0 calc(var(--fw)*.87) var(--fw);border-image:var(--dlg-frame);border-radius:0;
 background:linear-gradient(180deg,#22120b,#1b0e09);background-clip:padding-box;background-origin:padding-box;box-shadow:0 0 0 1px #0a0302,0 40px 70px rgba(0,0,0,.6)}

.dlg:is(.dlg-menu,.dlg-rules,.dlg-hist) .face::after{content:"";position:absolute;left:0;right:0;bottom:0;top:var(--hdh);z-index:6;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.085) 0 1px,transparent 1px 3px)}
.dlg:is(.dlg-menu,.dlg-rules,.dlg-hist) .hd{position:relative;height:var(--hdh);background:url(assets/ui2/dlg-band.webp?bpv=a8b6ed1e) center/auto 100% repeat-x #8a1a0c;box-shadow:0 1px 0 #0a0302,0 3px 8px rgba(0,0,0,.5)}
#stage[data-mode] .dlg:is(.dlg-menu,.dlg-rules,.dlg-hist) .x{position:absolute;right:4px;top:0;width:44px;height:44px}
#stage[data-mode] .dlg:is(.dlg-menu,.dlg-rules,.dlg-hist) .x .scr{top:calc(var(--hdh)/2);width:var(--sw);height:var(--sw);margin:calc(var(--sw)/-2) 0 0 calc(var(--sw)/-2)}

<style id="bp-dlgauto" media="not all">
/* ================= Окно «Autoplay»: чистый вид, как окно Buy bonus (2026-10-13, по эталону berserk-mode) =================
   Подключает dialogs-f-auto.js: текст попадает в shadow DOM окна через DlgF.shell(…, extraCss) и идёт ПОСЛЕ общих стилей окон F — поэтому здесь можно снять с этого окна раму, ленту и плиту.
   Без рамы, ленты, плиты и развёртки: содержимое стоит прямо на затемнении (затемнение — фон хоста .bp-wrap, его ставит dialogs-f-auto.js). Винт закрытия — в правом верхнем углу экрана.
   Разметка: .dlg.dlg-auto > .face > header.hd(.x) + .bd[.ttl, .dv.dt, .a-body[.a-sec.a-sec-n, .a-sec.a-sec-w]] + .dv.df + .a-go[.a-start, .a-note]
     .a-cnt  — плитки числа спинов (role=radiogroup) · .a-n — плитка
     .a-stop — условия остановки (флажки, role=checkbox) · .a-opt — строка (квадрат .ck + текст .t)
     .a-go   — подвал: кнопка START и фраза про цену спина; подвал не прокручивается, кнопка всегда на виду
   Плитки и кнопки — тёмно-красные плашки с латунным кантом (как ставка в Buy bonus), выбранная плитка — янтарь; START — тёмно-красный металл, как BUY. */

/* ---------- снимаем раму, ленту и плиту ---------- */
.dlg.dlg-auto{position:static;border:0;border-image:none;background:none;box-shadow:none;width:min(560px,calc(100% - 112px));color:#f3e8cc;--amber:#FFC861;--brass:#c98a2c;--p1:#3a1612;--p2:#1c0b09;--edge:#0a0302}

.dlg-auto .face::after{content:none}
.dlg-auto .hd{position:static;height:0;background:none;box-shadow:none}

/* винт закрытия — в углу экрана (сцена .layer — ближайший позиционированный предок), всегда на виду */
.dlg-auto .x{position:absolute;right:10px;top:10px;z-index:8;width:48px;height:48px}
.dlg-auto .x .scr{top:50%;width:34px;height:34px;margin:-17px 0 0 -17px}
.dlg-auto .x:focus-visible .scr{outline:3px solid var(--amber);outline-offset:3px}
.dlg-auto :focus-visible{outline-color:var(--amber)}

/* ---------- название ---------- */
.dlg-auto .ttl{justify-content:center;min-height:0;padding:0 0 18px}
.dlg-auto .ttl h2{font-size:44px;line-height:1.05;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);text-shadow:0 3px 0 #1a0705,0 0 26px rgba(255,170,60,.28)}

/* ---------- тело ---------- */
.a-body{flex:none;display:flex;flex-direction:column;gap:22px;padding:0 4px 8px}
.a-sec{min-width:0}
/* подпись раздела — слово между двумя латунными линиями, как SPIN MODE в Buy bonus */
.a-lab{display:flex;align-items:center;gap:14px;margin:0 0 12px;font:700 14px/1 var(--barlow);letter-spacing:.34em;text-transform:uppercase;color:#e9c98e;white-space:nowrap}
.a-lab::before,.a-lab::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass))}
.a-lab::after{background:linear-gradient(90deg,var(--brass),transparent)}

/* плитки числа спинов: в одну строку; выбранная — янтарь */
.a-cnt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;container-type:inline-size}
.a-n{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 2px;border-radius:6px;
 font:400 clamp(17px,5.4cqw,26px)/1 "Russo One",var(--ui);color:var(--amber);font-variant-numeric:tabular-nums;

<style id="bp-dlgnote" media="not all">
/* ================= Окна F (Меню, Правила, История, Autoplay) в виде «Записка на плите» =================
   Дополнение к dialogs-f.css (и dialogs-f-auto.css): подключается ПОСЛЕ них внутрь shadow-корня окна только при <html data-plates="note"> (dialogs-f.js shell(), текст файла берётся из <link id="bp-dlgnote"> / <style id="bp-dlgnote">).
   Разметка и логика окон не менялись: перекрашены переменные :host (цвета и шрифты), рама окна стала плитой цвета рамки слота (assets/uikit/hud-m1-rust.webp?bpv=7da0f75f + сколы), лента-шапка и винт — печатная коробка «×» на бумаге,
   лист .face — кремовая бумага (assets/plates-note/paper.webp?bpv=0b9b4844) с неровным краем и узкой плотной тенью, два куска скотча на углах плиты. Подробный вид и причины — в plates-note.css.
   Чернила #241a12, красные #8e2a1c (суммы, номера, важные слова), вторичный #55402f. Кнопки — печатные коробки с рамкой 2 px, выбранное — залито чернилами. Без свечений, без теней у текста. */

:host{--pn-paper:#dccfa9;--pn-ink:#241a12;--pn-ink2:#55402f;--pn-red:#8e2a1c;
 --cream:#241a12;--cream2:#241a12;--amber:#8e2a1c;--lit:#8e2a1c;--tx:#241a12;--tx2:#55402f;--dark:#dccfa9;--ttl:#241a12;
 --line:rgba(36,26,18,.9);--row-bd:1px solid rgba(36,26,18,.3);--row-sh:none;--fade:#dccfa9;--dlg-line:rgba(36,26,18,.3);--dlg-line-hi:transparent;
 --pn-fe:"PN Elite","Special Elite",ui-monospace,monospace;--pn-fs:"PN Stardos","Stardos Stencil",Impact,sans-serif;--pn-fw:16px;
 --pn-tex:url(assets/plates-note/paper.webp?bpv=0b9b4844) 0 0/360px auto;
 --pn-cut:polygon(.2% .5%,9% .1%,26% .4%,47% 0,71% .4%,90% .1%,99.8% .4%,100% 14%,99.6% 36%,100% 61%,99.7% 83%,100% 99.6%,84% 99.9%,63% 99.4%,38% 100%,17% 99.5%,.2% 99.8%,0 80%,.4% 58%,0 33%,.3% 12%)}

 background-blend-mode:soft-light,overlay,normal,normal,normal;background-size:256px,256px,auto,200px auto,auto;background-clip:border-box;background-origin:border-box;
 box-shadow:0 0 0 1px #0a0302,inset 0 0 0 1px rgba(150,113,48,.42),0 14px 20px -8px rgba(0,0,0,.75)}

.dlg::before,.dlg::after{content:"";position:absolute;z-index:6;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(30,12,4,.35));background-repeat:no-repeat;background-size:100% 100%}

.dlg-hist::after{right:-13px;top:auto;bottom:18px;width:56px;height:20px;background-image:url(assets/plates-note/tape-b.webp?bpv=e22e64cc);transform:rotate(54deg)}
.dlg-auto::before{left:50%;margin-left:-47px;top:-9px;width:94px;height:22px;background-image:url(assets/plates-note/tape-c.webp?bpv=1f851545);transform:rotate(2deg)}
.dlg-auto::after{left:auto;right:-13px;top:auto;bottom:14px;width:58px;height:20px;background-image:url(assets/plates-note/tape-a.webp?bpv=d905b746);transform:rotate(-49deg)}
.dlg-menu::before{left:-14px;top:0;width:70px;height:24px;transform:rotate(-34deg)}
.dlg-menu::after{right:-11px;top:2px;width:56px;height:20px}
